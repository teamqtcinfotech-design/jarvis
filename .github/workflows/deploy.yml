name: Test and deploy JARVIS

# Every push to main: run the backend tests; only if they pass, deploy to the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis-ci-only
          POSTGRES_DB: jarvis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jarvis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DB_NAME: jarvis
      DB_USER: jarvis
      DB_PASSWORD: jarvis-ci-only
      DB_HOST: localhost
      JARVIS_AI_ENABLED: "false"   # tests never call the AI
      TASKPANEL_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test core --noinput

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on the VPS (JARVIS only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: bash /srv/jarvis/deploy/deploy.sh
