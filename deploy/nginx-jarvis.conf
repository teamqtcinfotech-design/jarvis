# NEW nginx site for JARVIS only. Copy to /etc/nginx/sites-available/jarvis — other sites are not changed.
# Replace jarvis.example.com with your JARVIS subdomain (DNS A record -> this VPS), then run certbot for HTTPS.
server {
    listen 80;
    server_name jarvis.example.com;

    client_max_body_size 2m;

    location /static/ {
        alias /srv/jarvis/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
